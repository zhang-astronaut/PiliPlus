# 自动构建 Android APK：push / 打 tag / 手动触发时产出并上传。
name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（留空仅上传 artifact）"
        required: false
        default: ""
        type: string

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply PiliPlus patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Write keystore (optional)
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.SIGN_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo storeFile='key.jks' >> android/key.properties
          echo storePassword="$KEYSTORE_PASSWORD" >> android/key.properties
          echo keyAlias="$KEY_ALIAS" >> android/key.properties
          echo keyPassword="$KEY_PASSWORD" >> android/key.properties

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

      - name: Rename APKs
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-Android-${{ github.sha }}
          path: PiliPlus_android_*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: PiliPlus_android_*.apk
          generate_release_notes: true

      - name: Create GitHub Release (workflow_dispatch tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: PiliPlus_android_*.apk
          generate_release_notes: true
